name: CI

on:
  push:
    branches: ['**'] # milestone branches get CI before merging to main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  SUPABASE_CLI_VERSION: 2.118.0

jobs:
  quality:
    name: Format · Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Each step goes through scripts/ci-annotate.sh, which turns the tail of a failed
      # command's output into a GitHub annotation (readable without signing in).
      - name: Start Postgres only (applies migrations)
        run: bash scripts/ci-annotate.sh "db start" supabase db start
      - name: Apply migrations + seed from zero
        run: bash scripts/ci-annotate.sh "db reset" supabase db reset
      - name: pgTAP
        run: bash scripts/ci-annotate.sh "pgTAP" supabase test db
      - name: Schema lint
        # Only our schemas; extension code (e.g. PostGIS) is not ours to lint.
        run: bash scripts/ci-annotate.sh "db lint" supabase db lint --schema public,private,audit --level warning --fail-on error
      # Booking-engine races, fuzzing and latency against the same disposable database.
      # CI runs reduced sizes; full Gate A sizes (100 runs, 10k ops × 5 seeds) run locally per milestone.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Concurrency · fuzz · performance
        env:
          CONCURRENCY_RUNS: 25
          FUZZ_OPS: 2000
          FUZZ_SEEDS: 1,2
          PERF_SAMPLES: 30
        run: bash scripts/ci-annotate.sh "db-tests" pnpm --filter @app/db-tests test:db

  build:
    name: Build web + admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@app/web --filter=@app/admin

  e2e:
    name: E2E (Playwright, web + admin)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Auth flows (M4) run against the real local stack: Auth with Turnstile test keys and fixed
      # test OTPs (supabase/config.toml), the database RPCs and the Edge Functions.
      - name: Start local Supabase
        run: bash scripts/ci-annotate.sh "supabase start" supabase start -x studio,imgproxy,logflare,vector,inbucket,realtime,storage-api,postgres-meta,supavisor
      - name: App env from the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          for app in web admin; do
            {
              echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            } > "apps/$app/.env.local"
          done
          echo 'NEXT_PUBLIC_ENABLE_LAB=true' >> apps/web/.env.local
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@app/web --filter=@app/admin
      - name: Web e2e
        env:
          E2E_AUTH: '1'
          NEXT_PUBLIC_ENABLE_LAB: 'true'
        run: pnpm --filter @app/web test:e2e
      - name: Admin e2e
        env:
          E2E_AUTH: '1'
        run: pnpm --filter @app/admin test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/admin/playwright-report
          retention-days: 7
